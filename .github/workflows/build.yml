name: Build ShortsMaker.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Self-test code (Python)
        timeout-minutes: 5
        run: python -c "import engine; assert engine.selftest('.')"

      - name: Build exe
        run: >
          pyinstaller --onefile --windowed --name ShortsMaker
          --collect-all imageio_ffmpeg --collect-all moviepy
          --collect-data certifi --collect-all edge_tts --collect-all imageio --collect-all customtkinter
          --copy-metadata imageio --copy-metadata imageio_ffmpeg --copy-metadata moviepy
          app.py

      - name: Self-test exe (FFmpeg, fonts, rendering)
        timeout-minutes: 6
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\ShortsMaker.exe" -ArgumentList "--selftest","$PWD" -Wait -PassThru
          $log = "$env:APPDATA\ShortsMaker\selftest_log.txt"
          if ($p.ExitCode -ne 0 -or -not (Test-Path selftest_shorts.mp4) -or -not (Test-Path selftest_long.mp4)) {
            $t = "no log"
            if (Test-Path $log) { $t = (Get-Content $log -Raw) }
            $t = $t.Substring([Math]::Max(0, $t.Length - 3000)) -replace "`r?`n", '%0A'
            Write-Host "::error title=selftest exit $($p.ExitCode)::$t"
            throw "Self-test failed (exit $($p.ExitCode))"
          }
          Write-Host "Self-test OK"

      - name: Screenshot UI
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force "$env:APPDATA\ShortsMaker" | Out-Null
          '{"pixabay_key": "demo"}' | Set-Content "$env:APPDATA\ShortsMaker\config.json"
          $p = Start-Process "dist\ShortsMaker.exe" -PassThru
          Start-Sleep -Seconds 25
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\ui-screenshot.png")
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ShortsMaker v${{ github.run_number }}
          files: |
            dist/ShortsMaker.exe
            ui-screenshot.png
          make_latest: true
